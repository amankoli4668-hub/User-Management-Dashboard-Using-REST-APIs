<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Practice Dashboard</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: sans-serif;
        padding: 20px;
      }

      h1 {
        text-align: center;
        margin-bottom: 1rem;
        text-decoration: underline;
      }

      #btn-create,
      .delete-btn,
      .update-btn {
        text-align: center;
        padding: 0.4rem 0.6rem;
        border-radius: 0.5rem;
        color: white;
        background-color: rgb(0, 153, 255);
        border: none;
        cursor: pointer;
      }

      #btn-create {
        margin-left: 1rem;
      }

      #user-list {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
      }

      .user-card {
        min-width: 17rem;
        border: 1px solid #ccc;
        border-radius: 1rem;
        padding: 10px;
        margin: 10px;
      }

      .user-name,
      .user-email {
        margin-bottom: 0.5rem;
        font-size: 1rem;
        margin-left: 0.2rem;
      }

      #status {
        color: rgb(49, 63, 255);
        text-align: center;
        font-weight: bold;
        font-size: 1.5rem;
        margin-top: 10px;
      }

      .btns {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .delete-btn {
        background-color: red;
      }
      .update-btn {
        background-color: rgb(232, 69, 134);
      }

      .error-box {
        margin-left: 1.2rem;
        font-size: 1.2rem;
        color: rgb(42, 42, 42);
      }
    </style>
  </head>

  <body>
    <h1>User Management Dashboard</h1>

    <button id="btn-create">Add New User</button>

    <div id="status"></div>

    <div id="user-list"></div>

    <script>
      const API_URL = "https://jsonplaceholder.typicode.com/users";

      const userListDiv = document.getElementById("user-list");

      const statusDiv = document.getElementById("status");

      function setStatus(message) {
        statusDiv.textContent = message;
      }

      function AppendElement(user) {
        const userCard = document.createElement("div");
        userCard.classList.add("user-card");

        const detail = document.createElement("div");
        detail.classList.add("details");

        const UserName = document.createElement("p");
        UserName.classList.add("user-name");
        UserName.textContent = `Name: ${user.name}`;

        const UserEmail = document.createElement("p");
        UserEmail.classList.add("user-email");
        UserEmail.textContent = `Email: ${user.email}`;

        detail.append(UserName);
        detail.append(UserEmail);

        const Btns = document.createElement("div");
        Btns.classList.add("btns");
        Btns.dataset.id = user.id;
        Btns.addEventListener("click", async (event) => {
          if (event.target.classList.contains("delete-btn")) {
            const id = event.target.parentElement.dataset.id;
            deleteUser(id);
          } else if (event.target.classList.contains("update-btn")) {
            const id = event.target.parentElement.dataset.id;
            updateUserEmail(id);
          }
        });

        // 4. Add Update Email button
        const updateBtn = document.createElement("button");
        updateBtn.classList.add("update-btn");
        updateBtn.textContent = "Update Email";

        // 5. Add Delete button
        const deleteBtn = document.createElement("button");
        deleteBtn.classList.add("delete-btn");
        deleteBtn.textContent = "Delete";

        Btns.append(updateBtn);
        Btns.append(deleteBtn);

        userCard.append(detail);
        userCard.append(Btns);

        userListDiv.append(userCard);
      }

      // TASK 1: GET USERS
      async function loadUsers() {
        setStatus("Loading...");
        // TODO:
        try {
          // 1. Fetch users from API
          const response = await fetch(API_URL);

          if (!response.ok) {
            throw new Error(`Status: ${response.status}`);
          }

          // 2. Convert response to JSON
          const data = await response.json();

          // 3. Display users in the DOM
          data.forEach((user) => {
            AppendElement(user);
          });
        } catch (error) {
          // 6. Handle errors
          const errorBox = document.createElement("div");
          errorBox.classList.add("error-box");
          errorBox.textContent = error.message;

          userListDiv.append(errorBox);
        } finally {
          // 7. Clear loading state
          setStatus("");
        }
      }

      // TASK 2: CREATE USER
      document
        .getElementById("btn-create")
        .addEventListener("click", async () => {
          setStatus("Adding...");

          const naam = prompt("Enter your name here!");
          const gmail = prompt("Enter your Email here!");

          const newUser = {
            name: naam,
            email: gmail,
          };

          try {
            // 1. Send POST request
            const response = await fetch(API_URL, {
              method: "POST",
              // 2. Set headers
              headers: {
                "Content-Type": "application/json",
              },
              // 3. Send JSON request body
              body: JSON.stringify(newUser),
            });

            // 4. Handle response
            if (!response.ok) {
              throw new Error(`Status: ${response.status}`);
            }

            // 5. Append user to UI
            const data = await response.json();
            AppendElement(data);
          } catch (error) {
            // 6. Handle errors
            alert(error.message);
          } finally {
            // 7. Clear loading state
            setStatus("");
          }
        });

      // TASK 3: UPDATE USER EMAIL
      async function updateUserEmail(userId) {
        setStatus("updating...");

        const gmail = prompt("Enter your updated Email!");
        // TODO:
        try {
          // 1. Identify selected user
          const user = await fetch(`${API_URL}/${userId}`);
          // 2. Send PUT request
          const response = await fetch(`${API_URL}/${userId}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
            },
            // 3. Update email
            body: JSON.stringify({
              ...user,
              email: gmail,
            }),
          });

          if (!response.ok) {
            throw new Error(response.status);
          }

          // 4. Update UI after success
          const Email = document.querySelector(`[data-id="${userId}"]`)
            .parentElement.children[0].children[1];
          Email.textContent = `Email: ${gmail}`;
        } catch (error) {
          // 5. Handle errors
          alert("Error " + error);
        } finally {
          // 6. Clear loading state
          setStatus("");
        }
      }

      // TASK 4: DELETE USER
      async function deleteUser(userId) {
        setStatus("Removing...");
        // TODO:
        try {
          // 1. Send DELETE request
          const response = await fetch(`${API_URL}/${userId}`, {
            method: "DELETE",
          });

          // 2. Check response status
          if (!response.ok) {
            throw new Error(response.status);
          }
          // 3. Remove user from DOM
          document
            .querySelector(`[data-id="${userId}"]`)
            .parentElement.remove();

          // 4. Handle errors
        } catch (error) {
          alert("Error: " + error);
        } finally {
          // 5. Clear loading state
          setStatus("");
        }
      }

      // Load users when the page opens
      loadUsers();
    </script>
  </body>
</html>
